# The Cargo project that `cargo: true` chunks are built in (see _common.R).
# Exact versions, plus the committed Cargo.lock, keep every render using the
# same crates.
[package]
name = "example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
csv = "=1.4.0"
rand = "=0.10.3"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
