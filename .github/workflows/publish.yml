# Render the book, HTML and PDF, and publish both to GitHub Pages. The HTML
# sidebar links to the PDF (`downloads: [pdf]` in _quarto.yml).
#
# No examples run here. Every example ran when its chapter was last rendered
# locally, and Quarto uses those results from the committed _freeze/
# directory, which keeps one file per format (html.json, tex.json). So the
# published book shows the output the prose was checked against. A chapter
# whose source changed without a new local render, in either format, fails
# the build instead of being run with a different toolchain.
#
# R is installed anyway, with knitr and rmarkdown but none of the book's
# packages: each frozen PDF result lists its knitr dependencies (an empty
# list here), and Quarto calls R to process them even when nothing runs.

name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the current one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that _freeze/ is up to date
        run: |
          status=0
          for qmd in *.qmd; do
            grep -qE '^```\{(r|rust)' "$qmd" || continue
            for format in html tex; do
              json="_freeze/${qmd%.qmd}/execute-results/$format.json"
              if [ ! -f "$json" ] ||
                 [ "$(md5sum < "$qmd" | cut -c1-32)" != "$(jq -r .hash "$json")" ]
              then
                echo "::error file=$qmd::$format results in _freeze/ are missing or out of date. Run quarto render locally and commit _freeze/."
                status=1
              fi
            done
          done
          exit $status

      # Same version as the local renders; TinyTeX for the PDF. Quarto finds
      # the latest TinyTeX release through the GitHub API, which can refuse
      # unauthenticated requests from a runner (403), so give it a token.
      - uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: 1.11.9
          tinytex: true

      # For the PDF's knitr dependencies; see the comment at the top
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr and rmarkdown
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - name: Render
        run: quarto render

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
